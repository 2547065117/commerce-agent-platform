services:
  agents:
    build: ../python
    env_file: ../python/.env
    restart: unless-stopped
  portal:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORTAL_BIND: 0.0.0.0
      AGENT_SERVICE_URL: http://agents:8000
    volumes:
      - portal_data:/app/data
    depends_on:
      - agents
    restart: unless-stopped
volumes:
  portal_data:
